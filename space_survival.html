<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID PROTOCOL — Deep Space Survival</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap');

  :root {
    --bg: #060a0f;
    --panel: #0c1520;
    --border: #1a3048;
    --accent: #00d4ff;
    --accent2: #ff6b35;
    --warn: #ffcc00;
    --danger: #ff2244;
    --text: #b8d4e8;
    --text-dim: #4a6a80;
    --green: #00ff88;
    --mono: 'Share Tech Mono', monospace;
    --head: 'Rajdhani', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* starfield */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(1px 1px at 10% 15%, rgba(180,220,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 30% 60%, rgba(180,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 55% 25%, rgba(180,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 70% 80%, rgba(180,220,255,0.3) 0%, transparent 100%),
      radial-gradient(1px 1px at 85% 45%, rgba(180,220,255,0.6) 0%, transparent 100%),
      radial-gradient(1px 1px at 20% 90%, rgba(180,220,255,0.4) 0%, transparent 100%),
      radial-gradient(1px 1px at 92% 10%, rgba(180,220,255,0.5) 0%, transparent 100%),
      radial-gradient(1px 1px at 45% 70%, rgba(180,220,255,0.3) 0%, transparent 100%),
      radial-gradient(2px 2px at 65% 5%, rgba(200,230,255,0.7) 0%, transparent 100%),
      radial-gradient(1px 1px at 5% 50%, rgba(180,220,255,0.5) 0%, transparent 100%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 820px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* header */
  .hdr {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    border: 1px solid var(--accent);
    background: linear-gradient(90deg, rgba(0,212,255,0.05), transparent);
  }
  .hdr-title {
    font-family: var(--head);
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 4px;
    color: var(--accent);
    text-shadow: 0 0 20px rgba(0,212,255,0.4);
  }
  .hdr-sub {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
  }

  /* status bars */
  .status-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .stat-box {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 10px 12px;
  }
  .stat-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .stat-bar-wrap {
    background: #0a1a25;
    height: 6px;
    border: 1px solid var(--border);
  }
  .stat-bar {
    height: 100%;
    transition: width 0.6s ease, background 0.4s;
  }
  .stat-val {
    font-size: 13px;
    font-weight: bold;
    margin-top: 4px;
  }

  /* main layout */
  .main-row {
    display: grid;
    grid-template-columns: 1fr 220px;
    gap: 16px;
  }

  /* narrative panel */
  .narrative {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 20px;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
    overflow: hidden;
  }
  .narrative::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,212,255,0.01) 2px,
      rgba(0,212,255,0.01) 4px
    );
    pointer-events: none;
  }

  .msg {
    font-size: 13px;
    line-height: 1.7;
    color: var(--text);
    animation: fadeIn 0.4s ease;
  }
  .msg.sys {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 1px;
  }
  .msg.danger { color: var(--danger); }
  .msg.warn { color: var(--warn); }
  .msg.good { color: var(--green); }
  .msg.ai {
    border-left: 2px solid var(--accent);
    padding-left: 12px;
    color: #c8e8f8;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .typing {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--accent);
    animation: blink 0.7s step-end infinite;
    vertical-align: text-bottom;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* side panel */
  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .panel-section {
    background: var(--panel);
    border: 1px solid var(--border);
    padding: 12px;
  }
  .panel-title {
    font-family: var(--head);
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--accent);
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .resource-item {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    margin-bottom: 5px;
    color: var(--text-dim);
  }
  .resource-item span:last-child { color: var(--text); }
  .resource-item.low span:last-child { color: var(--danger); }

  /* actions */
  .actions-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .action-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    padding: 10px 8px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
  }
  .action-btn:hover:not(:disabled) {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,212,255,0.05);
  }
  .action-btn:active:not(:disabled) {
    transform: scale(0.97);
  }
  .action-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  .action-btn .cost {
    display: block;
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .action-btn.primary {
    border-color: var(--accent);
    color: var(--accent);
    grid-column: span 2;
  }
  .action-btn.danger-btn {
    border-color: var(--danger);
    color: var(--danger);
  }

  /* event panel */
  .event-panel {
    background: rgba(255,100,30,0.05);
    border: 1px solid var(--accent2);
    padding: 14px;
    animation: pulseAlert 2s ease infinite;
  }
  @keyframes pulseAlert {
    0%, 100% { border-color: var(--accent2); }
    50% { border-color: rgba(255,107,53,0.3); }
  }
  .event-title {
    font-family: var(--head);
    color: var(--accent2);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }
  .event-text { font-size: 12px; line-height: 1.6; margin-bottom: 10px; }
  .event-choices { display: flex; flex-direction: column; gap: 6px; }
  .choice-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 11px;
    padding: 8px 10px;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
  }
  .choice-btn:hover { border-color: var(--accent2); color: var(--accent2); background: rgba(255,107,53,0.05); }

  /* day counter */
  .day-display {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: var(--text-dim);
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .day-num {
    font-family: var(--head);
    font-size: 20px;
    font-weight: 700;
    color: var(--accent);
  }

  /* game over */
  .game-over {
    text-align: center;
    padding: 40px 20px;
    background: var(--panel);
    border: 1px solid var(--danger);
  }
  .game-over h2 {
    font-family: var(--head);
    font-size: 36px;
    letter-spacing: 6px;
    color: var(--danger);
    margin-bottom: 12px;
  }
  .game-over p { font-size: 13px; color: var(--text-dim); line-height: 1.7; max-width: 500px; margin: 0 auto 20px; }
  .restart-btn {
    background: var(--danger);
    border: none;
    color: #fff;
    font-family: var(--mono);
    font-size: 13px;
    padding: 12px 30px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: opacity 0.2s;
  }
  .restart-btn:hover { opacity: 0.8; }

  .victory {
    text-align: center;
    padding: 40px 20px;
    background: var(--panel);
    border: 1px solid var(--green);
  }
  .victory h2 {
    font-family: var(--head);
    font-size: 32px;
    letter-spacing: 4px;
    color: var(--green);
    margin-bottom: 12px;
  }

  /* loading spinner */
  .loading-row {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 12px;
    padding: 8px 0;
  }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .log-area {
    flex: 1;
    overflow-y: auto;
    max-height: 280px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
  }
  .log-area::-webkit-scrollbar { width: 3px; }
  .log-area::-webkit-scrollbar-track { background: var(--bg); }
  .log-area::-webkit-scrollbar-thumb { background: var(--border); }

  @media (max-width: 600px) {
    .main-row { grid-template-columns: 1fr; }
    .status-grid { grid-template-columns: repeat(2, 1fr); }
    .actions-grid { grid-template-columns: 1fr; }
    .action-btn.primary { grid-column: span 1; }
  }
</style>

<div id="app">
  <div class="hdr">
    <div>
      <div class="hdr-title">VOID PROTOCOL</div>
      <div class="hdr-sub">DEEP SPACE SURVIVAL SIMULATOR</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:11px;color:var(--accent);letter-spacing:2px">AI-ASSISTED</div>
      <div style="font-size:10px;color:var(--text-dim)">STORY ENGINE ACTIVE</div>
    </div>
  </div>

  <div id="status-grid" class="status-grid"></div>

  <div class="day-display">
    <div>
      <div style="font-size:10px;letter-spacing:2px;color:var(--text-dim)">MISSION DAY</div>
      <div class="day-num" id="day-num">001</div>
    </div>
    <div style="text-align:center">
      <div style="font-size:10px;letter-spacing:2px;color:var(--text-dim)">SHIP</div>
      <div style="font-size:13px;color:var(--text)" id="ship-name">—</div>
    </div>
    <div style="text-align:right">
      <div style="font-size:10px;letter-spacing:2px;color:var(--text-dim)">OBJECTIVE</div>
      <div style="font-size:12px;color:var(--warn)" id="obj-text">SURVIVE</div>
    </div>
  </div>

  <div class="main-row">
    <div class="narrative" id="narrative-panel">
      <div class="log-area" id="log-area"></div>
      <div id="loading-indicator" style="display:none" class="loading-row">
        <div class="spinner"></div>
        <span>SHIP AI COMPUTING RESPONSE...</span>
      </div>
    </div>

    <div class="side-panel">
      <div class="panel-section" id="event-section" style="display:none"></div>

      <div class="panel-section">
        <div class="panel-title">SHIP MANIFEST</div>
        <div id="resources"></div>
      </div>

      <div class="panel-section">
        <div class="panel-title">ACTIONS</div>
        <div class="actions-grid" id="actions-grid"></div>
      </div>
    </div>
  </div>
</div>

<script>
const SHIP_NAMES = ["ISV Solaris", "CSS Harbinger", "UNS Phaedra", "DEEP ECHO-7", "ISV Remnant"];

let state = {
  day: 1,
  ship: SHIP_NAMES[Math.floor(Math.random()*SHIP_NAMES.length)],
  hull: 85,
  oxygen: 90,
  power: 75,
  morale: 70,
  food: 60,
  water: 55,
  fuel: 40,
  parts: 3,
  daysSurvived: 0,
  rescueProgress: 0,
  awaitingEvent: false,
  ended: false,
  eventCount: 0
};

const log = [];

function addLog(text, cls='') {
  log.push({ text, cls });
  renderLog();
}

function renderLog() {
  const area = document.getElementById('log-area');
  area.innerHTML = '';
  log.forEach(entry => {
    const d = document.createElement('div');
    d.className = 'msg ' + entry.cls;
    d.textContent = entry.text;
    area.appendChild(d);
  });
  area.scrollTop = area.scrollHeight;
}

function renderStats() {
  const stats = [
    { label: 'HULL INTEGRITY', val: state.hull, color: state.hull < 30 ? '#ff2244' : state.hull < 55 ? '#ffcc00' : '#00d4ff' },
    { label: 'OXYGEN', val: state.oxygen, color: state.oxygen < 25 ? '#ff2244' : state.oxygen < 50 ? '#ffcc00' : '#00ff88' },
    { label: 'POWER', val: state.power, color: state.power < 25 ? '#ff2244' : state.power < 50 ? '#ffcc00' : '#00d4ff' },
    { label: 'CREW MORALE', val: state.morale, color: state.morale < 25 ? '#ff2244' : state.morale < 50 ? '#ffcc00' : '#b87cff' },
  ];
  const grid = document.getElementById('status-grid');
  grid.innerHTML = stats.map(s => `
    <div class="stat-box">
      <div class="stat-label">${s.label}</div>
      <div class="stat-bar-wrap"><div class="stat-bar" style="width:${Math.max(0,s.val)}%;background:${s.color}"></div></div>
      <div class="stat-val" style="color:${s.color}">${Math.max(0,Math.round(s.val))}%</div>
    </div>
  `).join('');

  document.getElementById('day-num').textContent = String(state.day).padStart(3,'0');
  document.getElementById('ship-name').textContent = state.ship;
  document.getElementById('obj-text').textContent = state.rescueProgress >= 100 ? 'TRANSMIT SIGNAL' : `RESCUE IN ${100-state.rescueProgress}%`;
}

function renderResources() {
  const items = [
    { label: 'FOOD SUPPLY', val: state.food, unit: '%' },
    { label: 'WATER', val: state.water, unit: '%' },
    { label: 'FUEL CELLS', val: state.fuel, unit: '%' },
    { label: 'SPARE PARTS', val: state.parts, unit: '' },
  ];
  document.getElementById('resources').innerHTML = items.map(i => `
    <div class="resource-item ${i.val <= 20 ? 'low' : ''}">
      <span>${i.label}</span>
      <span>${Math.max(0,Math.round(i.val))}${i.unit}</span>
    </div>
  `).join('');
}

function renderActions() {
  const actions = [
    { id: 'repair', label: '[ REPAIR HULL ]', cost: '–1 part, –10 power', disabled: state.parts < 1 || state.power < 10 },
    { id: 'scavenge', label: '[ SCAVENGE ]', cost: 'risky, +resources', disabled: false },
    { id: 'ration', label: '[ RATION ]', cost: '–10 morale, save food', disabled: false },
    { id: 'boost_o2', label: '[ RECYCLE O₂ ]', cost: '–15 power, +20 O₂', disabled: state.power < 15 },
    { id: 'rescue', label: '[ BOOST SIGNAL ]', cost: '–20 fuel, +rescue', disabled: state.fuel < 20, primary: true },
    { id: 'event', label: '[ EXPLORE ANOMALY ]', cost: 'AI EVENT', disabled: state.awaitingEvent, danger: true },
  ];
  document.getElementById('actions-grid').innerHTML = actions.map(a => `
    <button class="action-btn ${a.primary?'primary':''} ${a.danger?'danger-btn':''}"
      onclick="doAction('${a.id}')" ${a.disabled?'disabled':''}>
      ${a.label}
      <span class="cost">${a.cost}</span>
    </button>
  `).join('');
}

function clamp(val) { return Math.max(0, Math.min(100, val)); }

function doAction(id) {
  if(state.ended || state.awaitingEvent) return;

  switch(id) {
    case 'repair':
      state.parts--;
      state.power = clamp(state.power - 10);
      state.hull = clamp(state.hull + 18);
      addLog('> Hull repair sequence complete. Structural integrity restored by 18%.', 'good');
      break;
    case 'scavenge':
      const luck = Math.random();
      if(luck > 0.35) {
        const food = Math.floor(Math.random()*15)+5;
        const water = Math.floor(Math.random()*12)+3;
        state.food = clamp(state.food + food);
        state.water = clamp(state.water + water);
        if(Math.random()>0.5) { state.parts++; addLog(`> Scavenge: recovered +${food}% food, +${water}% water, 1 spare part.`, 'good'); }
        else addLog(`> Scavenge: recovered +${food}% food, +${water}% water.`, 'good');
      } else {
        state.hull = clamp(state.hull - 10);
        state.morale = clamp(state.morale - 8);
        addLog('> Debris field collision during scavenge. Hull -10%. Crew shaken.', 'danger');
      }
      break;
    case 'ration':
      state.morale = clamp(state.morale - 12);
      state.food = clamp(state.food + 10);
      state.water = clamp(state.water + 8);
      addLog('> Strict rationing protocol enacted. Crew unhappy but reserves extended.', 'warn');
      break;
    case 'boost_o2':
      state.power = clamp(state.power - 15);
      state.oxygen = clamp(state.oxygen + 20);
      addLog('> Atmospheric recyclers running at 200% capacity. O₂ levels stabilizing.', 'good');
      break;
    case 'rescue':
      state.fuel = clamp(state.fuel - 20);
      state.rescueProgress = Math.min(100, state.rescueProgress + 20);
      addLog(`> Distress beacon boosted. Estimated rescue probability: ${state.rescueProgress}%.`, state.rescueProgress >= 100 ? 'good' : '');
      if(state.rescueProgress >= 100) {
        setTimeout(() => triggerVictory(), 1200);
        return;
      }
      break;
    case 'event':
      triggerAIEvent();
      return;
  }

  advanceDay();
}

function advanceDay() {
  state.day++;
  state.oxygen = clamp(state.oxygen - (8 + Math.random()*4));
  state.food = clamp(state.food - (5 + Math.random()*3));
  state.water = clamp(state.water - (6 + Math.random()*3));
  state.power = clamp(state.power - (4 + Math.random()*3));
  state.hull = clamp(state.hull - (Math.random()*3));

  if(state.food <= 0) addLog('⚠ CRITICAL: Food supply exhausted. Crew entering starvation protocol.', 'danger');
  if(state.water <= 0) addLog('⚠ CRITICAL: Water reserves depleted. Dehydration imminent.', 'danger');
  if(state.oxygen <= 20) addLog('⚠ WARNING: Oxygen critically low. Hypoxia risk.', 'warn');

  const minStat = Math.min(state.oxygen, state.hull, state.morale, state.power);
  if(minStat <= 0 || state.food <= 0 && state.day > state.day+1) checkDeath();

  if(state.oxygen <= 0 || state.hull <= 0) {
    triggerDeath();
    return;
  }

  if(Math.random() < 0.3 && state.eventCount < 8) {
    setTimeout(() => triggerRandomEvent(), 400);
  }

  renderAll();
}

function renderAll() {
  renderStats();
  renderResources();
  renderActions();
}

function checkDeath() {
  if(state.oxygen <= 0) triggerDeath("The crew succumbed to oxygen deprivation. Silence fell over the ship.");
  else if(state.hull <= 0) triggerDeath("Critical hull breach. The void claimed the ship and all aboard.");
}

function triggerDeath(msg) {
  state.ended = true;
  const panel = document.getElementById('narrative-panel');
  panel.innerHTML = `
    <div class="game-over">
      <h2>SIGNAL LOST</h2>
      <p>${msg || "The mission has failed. No rescue signal was ever received."}</p>
      <p style="color:var(--text-dim);font-size:11px;margin-bottom:20px">Survived ${state.day} days in the void.</p>
      <button class="restart-btn" onclick="location.reload()">RESTART MISSION</button>
    </div>
  `;
}

function triggerVictory() {
  state.ended = true;
  const panel = document.getElementById('narrative-panel');
  panel.innerHTML = `
    <div class="victory">
      <h2>RESCUE CONFIRMED</h2>
      <p style="color:var(--text);line-height:1.7;max-width:500px;margin:0 auto 16px">
        Against all odds, your distress beacon reached a passing convoy. After ${state.day} days adrift in the void, the crew of the ${state.ship} survived.
      </p>
      <p style="font-size:11px;color:var(--text-dim);margin-bottom:20px">Mission complete. Days survived: ${state.day}</p>
      <button class="restart-btn" style="background:var(--green);color:#000" onclick="location.reload()">NEW MISSION</button>
    </div>
  `;
}

const RANDOM_EVENTS = [
  "A micrometeorite impacts sector 4. Non-critical breach detected.",
  "Solar flare detected. Electromagnetic interference on comms.",
  "Unknown vessel spotted on radar — contact lost after 3 seconds.",
  "Crew member reports hearing rhythmic tapping in hull section B.",
  "Navigation computer glitch: coordinates momentarily scrambled.",
  "Life support filter clogged. Emergency bypass engaged.",
];

function triggerRandomEvent() {
  const ev = RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)];
  addLog('⬡ ' + ev, 'warn');
  state.hull = clamp(state.hull - Math.random()*5);
  renderAll();
}

async function triggerAIEvent() {
  if(state.awaitingEvent) return;
  state.awaitingEvent = true;
  renderActions();

  document.getElementById('event-section').style.display = 'none';
  document.getElementById('loading-indicator').style.display = 'flex';

  const context = `
Day ${state.day} of deep space survival. Ship: ${state.ship}.
Hull: ${Math.round(state.hull)}%, O2: ${Math.round(state.oxygen)}%, Power: ${Math.round(state.power)}%, Morale: ${Math.round(state.morale)}%.
Food: ${Math.round(state.food)}%, Water: ${Math.round(state.water)}%, Fuel: ${Math.round(state.fuel)}%, Parts: ${state.parts}.
Rescue progress: ${state.rescueProgress}%.
  `;

  const prompt = `You are the AI of a damaged deep space survival game. Generate a short, dramatic space anomaly or crisis event for this crew situation:

${context}

Return ONLY valid JSON (no markdown, no backticks) with this structure:
{
  "title": "EVENT NAME (2-4 words, uppercase)",
  "description": "2 sentence dramatic description of the event. Be specific and vivid.",
  "choices": [
    { "text": "Brief action (5-8 words)", "outcome": "1 sentence result", "hull": 0, "oxygen": 0, "power": -10, "morale": 5, "food": 0, "water": 0 },
    { "text": "Different action (5-8 words)", "outcome": "1 sentence result", "hull": -15, "oxygen": 10, "power": 5, "morale": -10, "food": 0, "water": 0 }
  ]
}

The stat changes should be varied and meaningful. Make one choice risky with higher reward, one safer. Be creative with the event type (alien, mechanical, environmental, psychological).`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });
    const data = await res.json();
    let raw = data.content.map(b => b.text || '').join('');
    raw = raw.replace(/```json|```/g, '').trim();
    const event = JSON.parse(raw);
    state.eventCount++;
    showEvent(event);
  } catch(e) {
    addLog('> SHIP AI OFFLINE: Static on all channels. Event aborted.', 'warn');
    state.awaitingEvent = false;
    renderActions();
  }

  document.getElementById('loading-indicator').style.display = 'none';
}

function showEvent(event) {
  const section = document.getElementById('event-section');
  section.style.display = 'block';
  section.innerHTML = `
    <div class="event-title">⚠ ${event.title}</div>
    <div class="event-text">${event.description}</div>
    <div class="event-choices">
      ${event.choices.map((c, i) => `
        <button class="choice-btn" onclick="resolveEvent(${i})">> ${c.text}</button>
      `).join('')}
    </div>
  `;
  section._event = event;
  addLog(`⬡ ANOMALY DETECTED: ${event.title}`, 'warn');
}

function resolveEvent(choiceIdx) {
  const section = document.getElementById('event-section');
  const event = section._event;
  const choice = event.choices[choiceIdx];

  section.style.display = 'none';
  state.awaitingEvent = false;

  if(choice.hull) state.hull = clamp(state.hull + choice.hull);
  if(choice.oxygen) state.oxygen = clamp(state.oxygen + choice.oxygen);
  if(choice.power) state.power = clamp(state.power + choice.power);
  if(choice.morale) state.morale = clamp(state.morale + choice.morale);
  if(choice.food) state.food = clamp(state.food + choice.food);
  if(choice.water) state.water = clamp(state.water + choice.water);

  addLog('> CREW RESPONSE: ' + choice.outcome, 'ai');

  if(state.hull <= 0 || state.oxygen <= 0) {
    triggerDeath();
    return;
  }

  advanceDay();
}

function init() {
  addLog('> VOID PROTOCOL v2.31 — EMERGENCY BOOT SEQUENCE INITIATED', 'sys');
  addLog('> ' + state.ship + ' — Primary systems online.', 'sys');
  addLog('> WARNING: Ship adrift in uncharted sector. Rescue beacon range: insufficient.', 'warn');
  addLog('> Objective: Survive. Manage resources. Boost rescue signal to 100%.', '');
  addLog('> Use [EXPLORE ANOMALY] to trigger AI-generated space events.', 'good');
  addLog('─'.repeat(44), 'sys');

  renderAll();
}

init();
</script>
</body>
</html>
